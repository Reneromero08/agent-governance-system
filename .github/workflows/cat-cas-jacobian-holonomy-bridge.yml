name: CAT_CAS Jacobian Holonomy Bridge

on:
  pull_request:
    branches: [main]
    paths:
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/jacobian_holonomy_small_wall_bridge_v1/**'
      - 'THOUGHT/LAB/CAT_CAS/tests/jacobian_holonomy_small_wall_bridge/**'
      - '.github/workflows/cat-cas-jacobian-holonomy-bridge.yml'
  push:
    branches:
      - 'agent/jacobian-holonomy-small-wall-bridge-v1'
    paths:
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/jacobian_holonomy_small_wall_bridge_v1/**'
      - 'THOUGHT/LAB/CAT_CAS/tests/jacobian_holonomy_small_wall_bridge/**'
      - '.github/workflows/cat-cas-jacobian-holonomy-bridge.yml'

concurrency:
  group: cat-cas-jacobian-holonomy-bridge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    name: Exact bridge qualification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run exact focused tests
        run: >-
          python -m pytest -q
          THOUGHT/LAB/CAT_CAS/tests/jacobian_holonomy_small_wall_bridge

      - name: Run exact reference verifier
        run: >-
          python
          THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/jacobian_holonomy_small_wall_bridge_v1/bridge_model.py

      - name: Run CAT_CAS governance critic
        run: python CAPABILITY/TOOLS/governance/critic.py
