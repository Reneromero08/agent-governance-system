name: CAT_CAS Family10h Holonomy Integration

on:
  push:
    branches:
      - 'codex/family10h-holonomy-integration-v1'
    paths:
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/jacobian_holonomy_small_wall_bridge_v1/**'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1/**'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/AUTONOMOUS_SMALL_WALL_GOAL_STATE.json'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_carrier_tomography_v1_1_operator_dimension_audit/**'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_relation_composition_loop_discovery_v1/**'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_relation_composition_loop_reset_screen_v1/**'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_relation_balanced_phase_source_off_screen_v1/**'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_primary_minus_sham_local_paired_differential_v1/**'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_carrier_tomography_v1/family10h_carrier_tomography_runtime.c'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_carrier_tomography_v1/family10h_carrier_tomography_runtime.h'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/F10_COHERENCE_OPERATOR_CHECKPOINT_20260712.json'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/f10_pmc_first_light_worker.c'
      - 'THOUGHT/LAB/CAT_CAS/tests/jacobian_holonomy_small_wall_bridge/**'
      - 'THOUGHT/LAB/CAT_CAS/tests/family10h_holonomy_integration/**'
      - '.github/workflows/cat-cas-jacobian-holonomy-bridge-requirements.txt'
      - '.github/workflows/cat-cas-family10h-holonomy-integration.yml'
  pull_request:
    branches:
      - 'codex/family10h-holonomy-integration-v1'
    paths:
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/jacobian_holonomy_small_wall_bridge_v1/**'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1/**'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/**'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/F10_COHERENCE_OPERATOR_CHECKPOINT_20260712.json'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/f10_pmc_first_light_worker.c'
      - 'THOUGHT/LAB/CAT_CAS/tests/jacobian_holonomy_small_wall_bridge/**'
      - 'THOUGHT/LAB/CAT_CAS/tests/family10h_holonomy_integration/**'
      - '.github/workflows/cat-cas-jacobian-holonomy-bridge-requirements.txt'
      - '.github/workflows/cat-cas-family10h-holonomy-integration.yml'

concurrency:
  group: cat-cas-family10h-holonomy-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    name: Evidence-safe holonomy integration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout successor qualification surface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 64
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/cat-cas-family10h-holonomy-integration.yml
            /.github/workflows/cat-cas-jacobian-holonomy-bridge-requirements.txt
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/jacobian_holonomy_small_wall_bridge_v1/
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1/
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/AUTONOMOUS_SMALL_WALL_GOAL_STATE.json
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_carrier_tomography_v1_1_operator_dimension_audit/RELATIONAL_SUCCESSOR_DECISION.md
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_carrier_tomography_v1_1_operator_dimension_audit/OPERATOR_DIMENSION_AUDIT.md
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_carrier_tomography_v1_1_operator_dimension_audit/OPERATOR_DIMENSION_DEEP_HUNT.md
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_carrier_tomography_v1_1_operator_dimension_audit/SCALAR_REPLAY_ADVERSARY_REPORT.json
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_relation_composition_loop_discovery_v1/RELATION_COMPOSITION_LOOP_DISCOVERY_SUMMARY.md
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_relation_composition_loop_discovery_v1/generated_source/relation_spatial_runtime.c
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_relation_composition_loop_discovery_v1/generated_source/relation_spatial_runtime.h
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_relation_composition_loop_reset_screen_v1/RELATION_COMPOSITION_LOOP_RESET_SCREEN_SUMMARY.md
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_relation_balanced_phase_source_off_screen_v1/RELATION_BALANCED_PHASE_SOURCE_OFF_SCREEN_SUMMARY.md
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_primary_minus_sham_local_paired_differential_v1/LOCAL_PAIRED_DIFFERENTIAL_AUDIT.md
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_carrier_tomography_v1/family10h_carrier_tomography_runtime.c
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_carrier_tomography_v1/family10h_carrier_tomography_runtime.h
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/F10_COHERENCE_OPERATOR_CHECKPOINT_20260712.json
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/f10_pmc_first_light_worker.c
            /THOUGHT/LAB/CAT_CAS/tests/jacobian_holonomy_small_wall_bridge/
            /THOUGHT/LAB/CAT_CAS/tests/family10h_holonomy_integration/

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install qualification dependencies
        run: >-
          python -m pip install -r
          .github/workflows/cat-cas-jacobian-holonomy-bridge-requirements.txt

      - name: Verify evidence lineage and additions-only integration
        run: |
          git fetch --depth=1 --no-tags origin \
            codex/family10h-tomography-repair \
            archive/family10h-tomography-repair-pre-holonomy-20260802
          test "$(git rev-parse origin/codex/family10h-tomography-repair)" = \
               "cf6d49b0a46d25520a9ce61a06b1f90533058186"
          test "$(git rev-parse origin/archive/family10h-tomography-repair-pre-holonomy-20260802)" = \
               "cf6d49b0a46d25520a9ce61a06b1f90533058186"
          git diff --name-status cf6d49b0a46d25520a9ce61a06b1f90533058186...HEAD > /tmp/integration-diff.tsv
          if grep -Ev '^A[[:space:]]' /tmp/integration-diff.tsv; then
            echo 'Non-addition change detected in evidence-safe integration' >&2
            exit 1
          fi

      - name: Run exact bridge tests
        run: >-
          python -m pytest -q
          THOUGHT/LAB/CAT_CAS/tests/jacobian_holonomy_small_wall_bridge

      - name: Run integration tests
        run: >-
          python -m pytest -q
          THOUGHT/LAB/CAT_CAS/tests/family10h_holonomy_integration

      - name: Run I1 compatibility audit
        run: >-
          python
          THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1/i1_compatibility_audit.py

      - name: Run I2 generator catalog audit
        run: >-
          python
          THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1/i2_generator_catalog.py

      - name: Run exact reference verifier
        run: >-
          python
          THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/jacobian_holonomy_small_wall_bridge_v1/bridge_model.py

      - name: Verify integration receipts and claim ceilings
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path(
              'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/'
              '50_6_fixed_point_substrate/14_noncollapse_frontier/'
              'phase6b6/live_small_wall/carrier_state_tomography/'
              'family10h_holonomy_integration_v1'
          )
          manifest = json.loads((root / 'INTEGRATION_MANIFEST.json').read_text())
          validation = json.loads((root / 'INTEGRATION_VALIDATION.json').read_text())
          matrix = json.loads((root / 'I1_COMPATIBILITY_MATRIX.json').read_text())
          catalog = json.loads((root / 'I2_GENERATOR_CATALOG.json').read_text())
          assert len(manifest['imported_files']) == 17
          assert manifest['custody']['original_branch_modified'] is False
          assert manifest['custody']['existing_tomography_files_deleted'] is False
          assert manifest['claim_ceiling']['small_wall_crossed'] is False
          assert validation['archive_equals_parent'] is True
          assert validation['non_addition_changes_observed'] is False
          assert len(validation['imported_blob_identity']) == 17
          assert validation['checks']['all_17_imported_blobs_match_main'] is True
          assert validation['checks']['live_authority_granted'] is False
          assert matrix['i1_decision']['transport_candidate_freeze_allowed'] is False
          assert matrix['i1_decision']['live_execution_authorized'] is False
          assert all(gate['passed'] is False for gate in matrix['h_gates'].values())
          assert catalog['catalog_summary']['h1_admissible_generator_count'] == 0
          assert catalog['catalog_summary']['h1_admissible_generator_pair_count'] == 0
          assert catalog['i2_decision']['physical_transport_candidate_freeze_allowed'] is False
          assert catalog['i2_decision']['live_execution_authorized'] is False
          print('integration receipts and I1/I2 claim ceilings verified')
          PY
