name: CAT_CAS Family10h Holonomy I2B

on:
  push:
    branches:
      - 'codex/family10h-holonomy-integration-v1'
    paths:
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1/I2B_*'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1/i2b_pair_design.py'
      - 'THOUGHT/LAB/CAT_CAS/tests/family10h_holonomy_integration/test_i2b_pair_design.py'
      - '.github/workflows/cat-cas-family10h-holonomy-i2b.yml'
  pull_request:
    branches:
      - 'codex/family10h-holonomy-integration-v1'
    paths:
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1/I2B_*'
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1/i2b_pair_design.py'
      - 'THOUGHT/LAB/CAT_CAS/tests/family10h_holonomy_integration/test_i2b_pair_design.py'
      - '.github/workflows/cat-cas-family10h-holonomy-i2b.yml'

concurrency:
  group: cat-cas-family10h-holonomy-i2b-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    name: Second-generator and inverse design
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout I2B surface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1/
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/F10_COHERENCE_OPERATOR_CHECKPOINT_20260712.json
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/F10_PATH_RW_OBSERVE_CHECKPOINT_20260712.json
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/F10_ROUTE_OPERATOR_COMPARISON_CHECKPOINT_20260712.json
            /THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/F10_ROUTE_STATE_PILOT_CHECKPOINT_20260712.json
            /THOUGHT/LAB/CAT_CAS/tests/family10h_holonomy_integration/test_i2b_pair_design.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install pinned test dependency
        run: python -m pip install pytest==9.1.1

      - name: Run I2B tests
        run: >-
          python -m pytest -q
          THOUGHT/LAB/CAT_CAS/tests/family10h_holonomy_integration/test_i2b_pair_design.py

      - name: Run source-bound I2B audit
        run: >-
          python
          THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1/i2b_pair_design.py
