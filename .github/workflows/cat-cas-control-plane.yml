name: CAT_CAS Control Plane

on:
  pull_request:
    branches: [main]
    paths:
      - 'THOUGHT/LAB/CAT_CAS/**'
      - '.github/workflows/cat-cas-control-plane.yml'
  push:
    branches: [main]
    paths:
      - 'THOUGHT/LAB/CAT_CAS/**'
      - '.github/workflows/cat-cas-control-plane.yml'

concurrency:
  group: cat-cas-control-plane-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Phase-Lock Control Plane
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch frozen audio snapshot
        run: |
          FROZEN_SHA="$(python - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path("THOUGHT/LAB/CAT_CAS/control/branch_registry.json").read_text())
          for record in registry["branches"]:
              if record.get("pattern") == "codex/audio-frequency-wave-substrate":
                  print(record["frozen_head"])
                  break
          else:
              raise SystemExit("registered audio branch missing")
          PY
          )"
          if ! git cat-file -e "${FROZEN_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${FROZEN_SHA}"
          fi
          git cat-file -e "${FROZEN_SHA}^{commit}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install control-plane dependencies
        run: python -m pip install pytest jsonschema

      - name: Validate control plane
        run: python THOUGHT/LAB/CAT_CAS/tools/validate_control_plane.py

      - name: Check generated capability graph
        run: python THOUGHT/LAB/CAT_CAS/tools/generate_capability_graph.py --check

      - name: Run cold-agent structural tests
        run: python -m pytest THOUGHT/LAB/CAT_CAS/tests/control_plane/test_phase_lock_control_plane.py -q

      - name: Run CAT_CAS governance critic
        run: python CAPABILITY/TOOLS/governance/critic.py
