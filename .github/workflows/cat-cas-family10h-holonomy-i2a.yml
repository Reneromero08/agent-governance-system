name: CAT_CAS Family10h Holonomy I2A

on:
  push:
    branches:
      - 'codex/family10h-holonomy-integration-v1'
    paths:
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1/**'
      - 'THOUGHT/LAB/CAT_CAS/tests/family10h_holonomy_integration/test_i2a_runtime_interface.py'
      - '.github/workflows/cat-cas-family10h-holonomy-i2a.yml'
  pull_request:
    branches:
      - 'codex/family10h-holonomy-integration-v1'
    paths:
      - 'THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1/**'
      - 'THOUGHT/LAB/CAT_CAS/tests/family10h_holonomy_integration/test_i2a_runtime_interface.py'
      - '.github/workflows/cat-cas-family10h-holonomy-i2a.yml'

concurrency:
  group: cat-cas-family10h-holonomy-i2a-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    name: Compile-only post-source runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout I2A surface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1
            THOUGHT/LAB/CAT_CAS/tests/family10h_holonomy_integration/test_i2a_runtime_interface.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install pinned test dependency
        run: python -m pip install pytest==9.1.1

      - name: Run I2A tests
        run: >-
          python -m pytest -q
          THOUGHT/LAB/CAT_CAS/tests/family10h_holonomy_integration/test_i2a_runtime_interface.py

      - name: Validate I2A interface
        run: >-
          python
          THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1/i2a_runtime_interface.py

      - name: Strict C11 compile
        run: |
          root='THOUGHT/LAB/CAT_CAS/7_decoder/50_phase_bm_cpu/50_6_fixed_point_substrate/14_noncollapse_frontier/phase6b6/live_small_wall/carrier_state_tomography/family10h_holonomy_integration_v1'
          cc -std=c11 -Wall -Wextra -Werror -pedantic -O2 \
            -DF10HI_BUILD_SELF_TEST \
            "$root/post_source_operator_runtime.c" \
            -o /tmp/f10hi_i2a_self_test

      - name: Run compile-only lifecycle self-test
        run: |
          /tmp/f10hi_i2a_self_test | tee /tmp/f10hi_i2a_self_test.json
          grep -F '"passed":true' /tmp/f10hi_i2a_self_test.json
          grep -F '"physical_backend_implemented":false' /tmp/f10hi_i2a_self_test.json
          grep -F '"h1_generator_established":false' /tmp/f10hi_i2a_self_test.json
          grep -F '"h1_generator_pair_established":false' /tmp/f10hi_i2a_self_test.json
          grep -F '"live_execution_authorized":false' /tmp/f10hi_i2a_self_test.json
